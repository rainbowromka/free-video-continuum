[package]
name = "continuum-client"
version = "0.1.0"
edition = "2021"

[dependencies]
qmetaobject = { version = "0.2", default-features = false, features = ["log"] }
qttypes = { version = "0.2", default-features = false, features = ["required", "qtquick", "qtquickcontrols2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }